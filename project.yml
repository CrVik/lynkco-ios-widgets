name: LynkCarWidgets
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LynkCarWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - LynkCarWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lynk.widgets.extension
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/LynkCarWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  LynkCarWidgets:
    build:
      targets:
        LynkCarWidgets: all
